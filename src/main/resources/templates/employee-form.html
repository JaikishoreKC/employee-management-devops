<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title
	th:text="${employee.id == null ? 'Add Employee' : 'Edit Employee'}">
	Employee Form</title>

<style>
body {
	font-family: Arial, sans-serif;
	margin: 40px;
	background-color: #f5f5f5;
}

.container {
	max-width: 600px;
	margin: auto;
	background: white;
	padding: 30px;
	border-radius: 8px;
}

h1 {
	text-align: center;
	margin-bottom: 30px;
}

.form-group {
	margin-bottom: 18px;
}

label {
	display: block;
	margin-bottom: 6px;
	font-weight: bold;
}

input {
	width: 100%;
	padding: 10px;
	box-sizing: border-box;
	border: 1px solid #ccc;
	border-radius: 4px;
}

button {
	padding: 10px 18px;
	background-color: #198754;
	color: white;
	border: none;
	border-radius: 5px;
	cursor: pointer;
}

.back {
	margin-left: 10px;
	text-decoration: none;
	color: #555;
}
</style>
</head>

<body>

	<div class="container">

		<h1
			th:text="${employee.id == null ? 'Add Employee' : 'Edit Employee'}">
			Employee Form</h1>

		<form th:object="${employee}"
			th:action="${employee.id == null}
                     ? @{/employees/save}
                     : @{/employees/update/{id}(id=${employee.id})}"
			method="post">

			<div class="form-group">
				<label for="name">Name</label> <input type="text" id="name"
					th:field="*{name}" required>
			</div>

			<div class="form-group">
				<label for="email">Email</label> <input type="email" id="email"
					th:field="*{email}" required>
			</div>

			<div class="form-group">
				<label for="department">Department</label> <input type="text"
					id="department" th:field="*{department}" required>
			</div>

			<div class="form-group">
				<label for="salary">Salary</label> <input type="number" id="salary"
					th:field="*{salary}" min="0" step="0.01" required>
			</div>

			<button type="submit">Save Employee</button>

			<a class="back" th:href="@{/employees}"> Back to Employees </a>

		</form>

	</div>

</body>
</html>
